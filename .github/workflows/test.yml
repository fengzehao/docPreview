name: "Test"

on:
  push:
  pull_request:
    branches:
      - main
    types: [ opened ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/set-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Test with Maven
        run: mvn -B clean test